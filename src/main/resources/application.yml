server:
  port: 8091

spring:
  application:
    name: like-rag
  datasource:
    url: jdbc:postgresql://localhost:15432/rag
    username: rag
    password: rag123
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  thymeleaf:
    cache: false

rag:
  storage-root: data/rag
  chunk-max-tokens: 420
  chunk-overlap-tokens: 60
  top-k: 5
  embedding-dimension: 384
  async-index-fallback: true
  openai:
    api-key: ${OPENAI_API_KEY:sk-f6c21c55f1f6010912cf6311ee2fad128216dfeec1185d89d9a9b1f0cebafeb4}
    base-url: http://localhost:8080/v1
    chat-model: gpt-5.5
    chat-endpoint: chat-completions
    embedding-model: text-embedding-3-small
    embedding-dimensions: 384
    embedding-enabled: false
    timeout-seconds: 60
  mq:
    enabled: false
    topic: like-rag-index-topic
    consumer-group: like-rag-index-consumer

logging:
  level:
    cn.like.rag: info
