server:
  port: 8091

spring:
  application:
    name: like-rag
  datasource:
    url: jdbc:postgresql://localhost:15432/rag
    username: rag
    password: rag123
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  thymeleaf:
    cache: false

rag:
  storage-root: data/rag
  chunk-max-tokens: 420
  chunk-overlap-tokens: 60
  top-k: 5
  embedding-dimension: 384
  async-index-fallback: true
  openai:
    api-key: ${OPENAI_API_KEY:sk-f6c21c55f1f6010912cf6311ee2fad128216dfeec1185d89d9a9b1f0cebafeb4}
    base-url: http://localhost:8080/v1
    chat-model: gpt-5.5
    chat-endpoint: chat-completions
    embedding-model: text-embedding-3-small
    embedding-dimensions: 384
    embedding-enabled: false
    timeout-seconds: 60
  mq:
    enabled: false
    topic: like-rag-index-topic
    consumer-group: like-rag-index-consumer
  sentinel:
    enabled: true
    upload-qps: 1
    chat-qps: 5
    reindex-concurrency: 1
    embedding-max-concurrency: 4
    hybrid-search-max-concurrency: 8
    llm-max-concurrency: 3
    rerank-max-concurrency: 3
    llm-slow-call-rt-millis: 5000
    exception-ratio: 0.3
    circuit-break-window-seconds: 30
    min-request-amount: 5
  agent:
    enabled: true
    max-tool-calls: 6
    max-sub-tasks: 5
    max-run-millis: 30000
    max-react-steps-per-subtask: 4
    tool-search-top-k: 5
    planning-enabled: true
  eval:
    data-dir: eval/data
    ks: 5,10
    top-n: 50
    ndcg-gate: 0.75
    recall-gate: 0.80
    mrr-gate: 0.70
  rerank:
    enabled: true
    candidate-k: 20
    max-candidate-chars: 500
    max-output-tokens: 512
  conversation:
    enabled: true
    rewrite-enabled: true
    max-turns: 6
    max-history-chars: 4000
    max-stored-answer-chars: 1000
    session-ttl-seconds: 1800
    max-sessions: 1000

logging:
  level:
    cn.like.rag: info
